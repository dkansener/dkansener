name: Contribution snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#E0A12E&color_dots=#ebedf0,#cfe3df,#8fbab3,#3f7a76,#0E2A30
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F2B33D&color_dots=#161b22,#133A41,#1f5a62,#3a8a8f,#8FB1AC

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
