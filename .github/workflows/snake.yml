name: Contribution snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0B4EDB&color_dots=#ebedf0,#c9d6f5,#8aa6ec,#3f6fe0,#0A1424
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#527FFF&color_dots=#161b22,#16233d,#1d3a75,#2f5fd0,#8A9AB0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
